<title>Oele51 Hausverein App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column. Start page opens with the info board (events first, with picture), then three wide reservation buttons. Labelled bottom bar on every screen. */
:root {
  --bg: #F1F4EC;
  --surface: #FFFFFF;
  --ink: #0F1A1A;
  --muted: #36423F;
  --green: #2E4A27;
  --on-green: #FFFFFF;
  --green-soft: #DCE6D2;
  --sage: #5E6E55;
  --peach: #C8A898;
  --peach-soft: #F6E4DA;
  --line: #8A977F;
  --danger: #8C2414;
  --plate: #FFFFFF;
  --font: "Atkinson Hyperlegible", "Segoe UI", Verdana, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1414; --surface: #1B2323; --ink: #FFFFFF; --muted: #D2DAD0;
    --green: #B9D3A8; --on-green: #0C140C; --green-soft: #2C3A30; --sage: #A3B197;
    --peach: #E2C2B2; --peach-soft: #3E3028; --line: #7F8C83; --danger: #FFB0A4;
    --plate: #FFFFFF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1414; --surface: #1B2323; --ink: #FFFFFF; --muted: #D2DAD0;
  --green: #B9D3A8; --on-green: #0C140C; --green-soft: #2C3A30; --sage: #A3B197;
  --peach: #E2C2B2; --peach-soft: #3E3028; --line: #7F8C83; --danger: #FFB0A4;
  --plate: #FFFFFF; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1.125rem; line-height: 1.5; }
#app {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 120px;
  display: flex; flex-direction: column; gap: 24px;
}
#app.login { padding-block: 24px 32px; }
main { display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.9rem; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 1.4rem; line-height: 1.25; text-wrap: balance; }
h3 { font-size: 1.15rem; line-height: 1.3; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row > .grow { flex: 1 1 200px; min-width: 0; }
svg.ic { width: 1.6em; height: 1.6em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

button, .btn, input, select, textarea { font: inherit; color: inherit; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 10px 22px; border-radius: 12px;
  border: 2px solid var(--green); background: var(--surface); color: var(--ink);
  font-weight: 700; text-decoration: none; cursor: pointer; text-align: center;
}
.btn.primary { background: var(--green); color: var(--on-green); }
.btn.quiet { border-color: var(--line); font-weight: 400; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.wide { width: 100%; }
.btn[disabled] { border-style: dashed; border-color: var(--line); color: var(--muted); background: transparent; cursor: not-allowed; }
:focus-visible { outline: 4px solid var(--peach); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.top .name { flex: 1 1 auto; }
.row > .opt { flex: 1 1 8rem; align-items: center; text-align: center; }
.row > .opt b { hyphens: manual; overflow-wrap: normal; }
.loginbox > .btn.disp { align-self: flex-end; }
.plate { background: var(--plate); border-radius: 12px; padding: 6px 10px; flex: none; line-height: 0; }
.plate img { height: 52px; width: auto; }
.top .name { font-weight: 700; font-size: 1.25rem; line-height: 1.15; }
.top .name small { display: block; font-weight: 400; font-size: 1rem; color: var(--muted); }
.hello { display: flex; flex-direction: column; gap: 4px; }
.demo { background: var(--peach-soft); border-radius: 10px; padding: 10px 14px; font-size: .95rem; }

.loginbox { background: var(--surface); border-radius: 20px; padding: 28px 22px; display: flex; flex-direction: column; gap: 20px; }
.loginbox .logo { align-self: center; background: var(--plate); border-radius: 16px; padding: 8px; line-height: 0; }
.loginbox .logo img { width: 230px; height: auto; }
label { font-weight: 700; display: block; margin-bottom: 6px; }
label small { font-weight: 400; color: var(--muted); font-size: .95rem; }
input[type=text], input[type=password], input[type=date], input[type=email], input[type=url], select, textarea {
  width: 100%; min-height: 56px; padding: 12px 14px; border-radius: 12px;
  border: 2px solid var(--sage); background: var(--surface);
}
input[type=file] { width: 100%; }
textarea { min-height: 120px; resize: vertical; }
.check { display: flex; gap: 12px; align-items: center; font-weight: 400; margin: 0; min-height: 44px; }
.check input { width: 26px; height: 26px; accent-color: var(--green); flex: none; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.err { color: var(--danger); font-weight: 700; }
.err:empty { display: none; }

/* Info board on the start page */
.board { background: var(--surface); border-radius: 20px; padding: 20px 18px; display: flex; flex-direction: column; gap: 18px; }
.board > h2 { display: flex; align-items: center; gap: 10px; }
.pic { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; object-fit: cover; display: block; }
.pic.ph { background: var(--green-soft); color: var(--green); display: grid; place-items: center; }
.pic.ph svg { width: 76px; height: 76px; stroke-width: 1.5; }
.event { display: flex; flex-direction: column; gap: 12px; }
.meta { display: flex; flex-direction: column; gap: 6px; }
.meta > span { display: flex; gap: 8px; align-items: flex-start; }
.meta > span > span { min-width: 0; }
.note { border-top: 2px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.pill { display: inline-flex; align-items: center; align-self: flex-start; padding: 2px 12px; border-radius: 999px; font-size: .9rem; font-weight: 700; letter-spacing: .03em; background: var(--peach); color: #2B2320; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 65ch; }

.tiles { display: flex; flex-direction: column; gap: 12px; }
.tile {
  display: flex; align-items: center; gap: 16px; min-height: 88px; padding: 14px 16px; border-radius: var(--r);
  background: var(--surface); border: 2px solid var(--line); text-decoration: none; color: var(--ink);
}
.tile:hover { border-color: var(--green); }
.tile .badge { background: var(--green-soft); color: var(--green); border-radius: 50%; width: 58px; height: 58px; display: grid; place-items: center; flex: none; }
.tile .badge svg { width: 32px; height: 32px; }
.tile .txt { min-width: 0; display: flex; flex-direction: column; }
.tile strong { font-size: 1.2rem; line-height: 1.25; }
.tile .muted { font-size: .98rem; line-height: 1.35; }

.list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--line); }
.list > li { padding: 14px 0; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.list > li > .grow { flex: 1 1 220px; min-width: 0; }
.when { font-weight: 700; font-variant-numeric: tabular-nums; }
.contact { background: var(--green-soft); border-radius: var(--r); padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; }
.mail { font-weight: 700; user-select: all; overflow-wrap: anywhere; }

/* Booking */
.step { display: flex; flex-direction: column; gap: 12px; }
.step > h2 { display: flex; gap: 12px; align-items: center; }
.num { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 1.1rem; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr)); gap: 10px; }
.opt {
  min-height: 64px; padding: 10px 12px; border-radius: 12px; cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); text-align: left;
  display: flex; flex-direction: column; justify-content: center; gap: 2px; line-height: 1.25;
}
.opt b { overflow-wrap: anywhere; hyphens: auto; }
.opt small { font-size: .9rem; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: var(--on-green); }
.opt[aria-pressed="true"] small { color: var(--on-green); }
.days .opt { text-align: center; align-items: center; font-variant-numeric: tabular-nums; }
.hours { display: flex; flex-direction: column; gap: 6px; }
.slot {
  min-height: 54px; padding: 8px 16px; border-radius: 12px; text-align: left; width: 100%;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 16px;
  background: var(--surface); border: 2px solid var(--green); cursor: pointer;
}
.slot .t { font-weight: 700; font-variant-numeric: tabular-nums; }
.slot .s { display: inline-flex; align-items: center; gap: 8px; }
.slot.taken { border: 2px dashed var(--line); background: transparent; color: var(--muted); cursor: default; }
.slot.mine { background: var(--green-soft); cursor: default; }
.slot.picked { background: var(--green); color: var(--on-green); }
.wheels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.wheelbox { display: flex; flex-direction: column; gap: 8px; text-align: center; }
.wheelbox > b { font-size: 1.2rem; }
.wheel {
  height: 172px; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none;
  padding-block: 56px; border: 2px solid var(--sage); border-radius: 12px; background: var(--surface);
}
.wheel::-webkit-scrollbar { display: none; }
.wi { height: 56px; display: grid; place-items: center; scroll-snap-align: center; font-size: 1.3rem; font-variant-numeric: tabular-nums; color: var(--muted); cursor: pointer; }
.wi.on { background: var(--green); color: var(--on-green); font-weight: 700; }
.dur { font-size: 1.25rem; text-align: center; font-variant-numeric: tabular-nums; }
.confirm { background: var(--peach-soft); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
#ev-prev { max-height: 180px; border-radius: 12px; }

nav.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 2px solid var(--line);
  padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
}
nav.bar ul { list-style: none; margin: 0 auto; padding: 0; max-width: 760px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
nav.bar a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 66px; border-radius: 12px; text-decoration: none; color: var(--ink);
  font-size: min(.84rem, 15px); font-weight: 700; text-align: center; line-height: 1.15; overflow-wrap: anywhere;
}
nav.bar a[aria-current="page"] { background: var(--green); color: var(--on-green); }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  background: var(--ink); color: var(--bg); padding: 14px 22px; border-radius: 12px; font-weight: 700;
  max-width: calc(100% - 32px); text-align: center;
}
@media (prefers-reduced-motion: no-preference) { .tile, .opt, .slot, .btn { transition: border-color .15s, background-color .15s; } }
</style>

<div id="app" lang="de-CH"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
const CATS = { raum: 'Raum', tisch: 'Tisch', wasch: 'Waschmaschine', anderes: 'Anderes' };

/* ---------- Dates and hours ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = n => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return d; };
const today = () => iso(addDays(0));
const fmt = (s, opt) => new Intl.DateTimeFormat('de-CH', opt).format(fromIso(s));
const longDate = s => fmt(s, { weekday: 'long', day: 'numeric', month: 'long' });
const shortDate = s => fmt(s, { weekday: 'short', day: 'numeric', month: 'short' });
const span = (from, to) => pad(from) + '–' + pad(to) + ' Uhr';
const hoursText = n => n === 1 ? '1 Stunde' : n + ' Stunden';

/* ---------- State (demo: stored on this device only) ---------- */
const KEY = 'oele51-demo-v3';
let memory = null;
function seed() {
  const d = n => iso(addDays(n));
  const r = (id, name, cat, hint, dayOnly) => ({ id, name, cat, hint, open: 7, close: 22, dayOnly: !!dayOnly });
  return {
    user: null, admin: false, lastWash: 'w1',
    contact: { email: '', whatsapp: '' },
    resources: [
      r('gr', 'Gemeinschaftsraum', 'raum', 'Privater Anlass CHF 20 pro Tag'),
      r('te', 'Terrasse', 'raum', 'Beim Gemeinschaftsraum'),
      r('gz', 'Gästezimmer', 'raum', 'CHF 20 pro Nacht', true),
      r('t1', 'Festtisch 1', 'tisch', 'Beispiel'),
      r('t2', 'Festtisch 2', 'tisch', 'Beispiel'),
      r('w0', 'Erdgeschoss', 'wasch', 'Waschmaschine'),
      r('w1', '1. Stock', 'wasch', 'Waschmaschine'),
      r('w2', '2. Stock', 'wasch', 'Waschmaschine'),
      r('w3', '3. Stock', 'wasch', 'Waschmaschine')
    ],
    bookings: [
      { id: 'b1', res: 'gr', date: d(3), from: 14, to: 17, by: 'Vorstand', ev: 'e1' },
      { id: 'b2', res: 'te', date: d(9), from: 17, to: 20, by: 'Vorstand', ev: 'e2' },
      { id: 'b3', res: 'w1', date: d(1), from: 9, to: 12, by: 'Wohnung 1.02' },
      { id: 'b4', res: 'w1', date: d(1), from: 15, to: 16, by: 'Wohnung 1.04' },
      { id: 'b5', res: 'gz', date: d(5), from: 7, to: 22, by: 'Wohnung 0.02' },
      { id: 'b6', res: 'gr', date: d(1), from: 18, to: 22, by: 'Wohnung 1.02' }
    ],
    events: [
      { id: 'e1', title: 'Spielnachmittag', date: d(3), from: 14, to: 17, res: 'gr', desc: 'Jassen, Brettspiele, Kaffee und Kuchen. Alle sind willkommen.', img: '', by: 'Vorstand', going: ['Wohnung 2.03', 'Wohnung 1.02'] },
      { id: 'e2', title: 'Apéro auf der Terrasse', date: d(9), from: 17, to: 20, res: 'te', desc: 'Jede Wohnung bringt etwas Kleines mit.', img: '', by: 'Vorstand', going: ['Wohnung 3.01'] }
    ],
    posts: [
      { id: 'p1', title: 'Willkommen in der neuen Oele51-App', body: 'Hier kannst du Räume, Tische und die Waschmaschine reservieren und siehst, was im Haus läuft.', important: true, by: 'Vorstand', date: d(0) },
      { id: 'p2', title: 'Ruhezeiten', body: 'Von 22 bis 7 Uhr bitte nicht waschen oder tumblern (Hausordnung).', important: false, by: 'Vorstand', date: d(-2) }
    ]
  };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return memory || seed();
}
let S = load();
function save() { memory = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const ui = { res: {}, day: today(), more: false, sel: null, form: null, edit: null, del: null, img: '', disp: false, rep: { every: 0, months: 4 } };

/* ---------- Display settings (per device) ---------- */
const P = (() => { const d = { size: 0, theme: 'auto' }; try { return Object.assign(d, JSON.parse(localStorage.getItem('oele51-display') || '{}')); } catch (e) { return d; } })();
const hostTheme = document.documentElement.getAttribute('data-theme');
function applyP() {
  const de = document.documentElement;
  de.style.fontSize = ['100%', '118%', '136%'][P.size] || '100%';
  if (P.theme === 'light' || P.theme === 'dark') de.setAttribute('data-theme', P.theme);
  else if (hostTheme) de.setAttribute('data-theme', hostTheme); else de.removeAttribute('data-theme');
}
function saveP() { applyP(); try { localStorage.setItem('oele51-display', JSON.stringify(P)); } catch (e) {} }
applyP();

/* ---------- Helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICONS = {
  start: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/>',
  reservieren: '<rect x="4" y="3" width="13" height="18" rx="1"/><path d="M17 21h3"/><circle cx="13.5" cy="12" r=".6"/>',
  waschen: '<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13.5" r="4.5"/><path d="M7.5 6.5h2"/>',
  anlaesse: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="m9 15.5 2 2 4-4"/>',
  verwalten: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  board: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  up: '<path d="m6 15 6-6 6 6"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6.5L20.5 7"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  pin: '<path d="M12 21s6-5.6 6-10.5a6 6 0 1 0-12 0C6 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  user: '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.5 3.600-5 7-5s6.200 1.500 7 5"/>'
};
const ic = n => '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[n] + '</svg>';
const navItems = () => [['start', 'Start'], ['reservieren', 'Räume'], ['waschen', 'Waschen'], ['anlaesse', 'Anlässe']].concat(S.admin ? [['verwalten', 'Admin']] : []);
const route = () => { const h = location.hash.slice(1); return navItems().some(n => n[0] === h) ? h : 'start'; };
const resOf = id => S.resources.find(r => r.id === id);
const resLabel = r => r ? (r.cat === 'wasch' ? 'Waschmaschine ' + r.name : r.name) : 'Gelöscht';
const isFree = (res, date, from, to) => !S.bookings.some(b => b.res === res && b.date === date && b.from < to && from < b.to);
const timeLabel = (x, r) => (r && x.from <= r.open && x.to >= r.close) || x.all ? 'Ganzer Tag' : span(x.from, x.to);
const upcoming = list => list.filter(x => x.date >= today()).sort((a, b) => (a.date + pad(a.from)).localeCompare(b.date + pad(b.from)));
const hourOptions = (lo, hi, sel) => { let h = ''; for (let i = lo; i <= hi; i++) h += '<option value="' + i + '"' + (i === sel ? ' selected' : '') + '>' + pad(i) + ':00</option>'; return h; };
const optsRow = (a, cur, list) => '<div class="row">' + list.map(x => '<button class="opt" data-a="' + a + '" data-v="' + x[0] + '" aria-pressed="' + (cur === x[0]) + '"><b>' + x[1] + '</b></button>').join('') + '</div>';
// Repeating washing reservations: weekly or every 2 weeks, never further than 4 months ahead.
function occurrences(startIso, every, months) {
  const out = [startIso]; if (!every) return out;
  const lim = addDays(0); lim.setMonth(lim.getMonth() + Math.min(months, 4)); const limIso = iso(lim);
  const d = fromIso(startIso); d.setHours(12);
  for (;;) { d.setDate(d.getDate() + 7 * every); if (iso(d) > limIso) break; out.push(iso(d)); }
  return out;
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
}
function delButtons(kind, id, label, yes) {
  const key = kind + ':' + id;
  if (ui.del === key) return '<span class="row"><button class="btn danger" data-a="del-yes" data-v="' + key + '">' + yes + '</button><button class="btn quiet" data-a="del-no">Nein</button></span>';
  return '<button class="btn quiet" data-a="del-ask" data-v="' + key + '">' + label + '</button>';
}

/* ---------- Views ---------- */
const dispButton = () => '<button class="btn quiet disp" data-a="disp" aria-expanded="' + ui.disp + '"><b aria-hidden="true">Aa</b>Anzeige</button>';
function dispPanel() {

function dayBlocks(res, date) {
  const bs = S.bookings.filter(b => b.res === res.id && b.date === date);
  const nowH = date === today() ? new Date().getHours() : -1;
  const out = []; let h = res.open;
  while (h < res.close) {
    const b = bs.find(x => x.from <= h && x.to > h);
    if (b) { const to = Math.min(b.to, res.close); out.push({ from: h, to, b }); h = to; }
    else { if (h > nowH) out.push({ from: h, to: h + 1, b: null }); h++; }
  }
  return out;
}

/* Wheels for the washing machine: one for the start hour, one for the end hour. */
const WH = 56;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const loOf = res => ui.day === today() ? Math.max(res.open, new Date().getHours() + 1) : res.open;
function wheelHtml(id, label, vals, cur) {
  return '<div class="wheelbox"><b id="' + id + '-l">' + label + '</b>' +
    '<button class="btn quiet" data-a="wstep" data-v="' + id + ':-1" aria-label="' + label + ' eine Stunde früher">' + ic('up') + '</button>' +
    '<div class="wheel" id="' + id + '" role="listbox" tabindex="0" aria-labelledby="' + id + '-l" data-vals="' + vals.join(',') + '">' +
    vals.map(v => '<div class="wi' + (v === cur ? ' on' : '') + '" role="option" aria-selected="' + (v === cur) + '" data-a="wpick" data-v="' + id + ':' + v + '">' + pad(v) + ':00</div>').join('') + '</div>' +
    '<button class="btn quiet" data-a="wstep" data-v="' + id + ':1" aria-label="' + label + ' eine Stunde später">' + ic('down') + '</button></div>';
}
function setWheel(id, v) {
  const res = resOf(ui.res[route()]); if (!res || !ui.sel) return false;
  const lo = loOf(res), s = { from: ui.sel.from, to: ui.sel.to };
  if (id === 'wf') { s.from = clamp(v, lo, res.close - 1); if (s.to <= s.from) s.to = s.from + 1; }
  else { s.to = clamp(v, lo + 1, res.close); if (s.from >= s.to) s.from = s.to - 1; }
  const changed = s.from !== ui.sel.from || s.to !== ui.sel.to; ui.sel = s; return changed;
}
function syncWheels() {
  document.querySelectorAll('.wheel').forEach(w => { const on = w.querySelector('.on'); w.scrollTop = on ? Array.prototype.indexOf.call(w.children, on) * WH : 0; });
}
function washWheels(res, lo, dayFree, full) {
  if (lo >= res.close) return '<p class="muted">Heute ist es zu spät zum Waschen. Wähle einen anderen Tag.</p>';
  const taken = S.bookings.filter(b => b.res === res.id && b.date === ui.day).sort((a, b) => a.from - b.from);
  const sel = ui.sel, fv = [], tv = []; for (let i = lo; i < res.close; i++) { fv.push(i); tv.push(i + 1); }
  const clash = taken.filter(b => b.from < sel.to && sel.from < b.to);
  return '<div class="stack"><b>Schon reserviert an diesem Tag</b>' + (taken.length
      ? '<ul class="list">' + taken.map(b => '<li><span class="when">' + span(b.from, b.to) + '</span><span>' + esc(b.by === S.user ? 'Meine Reservation' : b.by) + '</span></li>').join('') + '</ul>'
      : '<p class="muted">Noch nichts. Der ganze Tag ist frei.</p>') + '</div>' +
    '<p class="muted">Dreh an den Rädern oder tippe auf die Pfeile.</p>' +
    '<div class="wheels">' + wheelHtml('wf', 'Von', fv, sel.from) + wheelHtml('wt', 'Bis', tv, sel.to) + '</div>' +
    '<p class="dur"><b>' + span(sel.from, sel.to) + '</b> · ' + hoursText(sel.to - sel.from) + '</p>' +
    (dayFree && lo === res.open ? '<button class="btn' + (full ? ' primary' : '') + '" data-a="allday">' + (full ? ic('check') : '') + 'Ganzer Tag (' + span(res.open, res.close) + ')</button>' : '') +
    (clash.length ? '<p class="err">In dieser Zeit ist schon reserviert (' + clash.map(b => span(b.from, b.to)).join(', ') + '). Wähle eine andere Zeit.</p>' : '');
}

function bookingView(kind) {
  const wash = kind === 'waschen';
  const group = S.resources.filter(r => (r.cat === 'wasch') === wash);
  let h = header(wash ? 'Waschmaschine reservieren' : 'Raum oder Tisch reservieren', wash ? 'Auf jedem Stock steht eine Waschmaschine.' : 'Drei Schritte: auswählen, Tag antippen, Zeit antippen.');
  if (!group.length) return h + '<main><p class="muted">Hier ist noch nichts eingerichtet.' + (S.admin ? ' Unter «Verwalten» kannst du etwas hinzufügen.' : '') + '</p></main>';
  let resId = ui.res[kind] || (wash ? S.lastWash : group[0].id);
  if (!group.some(r => r.id === resId)) resId = group[0].id;
  ui.res[kind] = resId;
  const res = resOf(resId);
  const days = Array.from({ length: ui.more ? 21 : 7 }, (_, i) => iso(addDays(i)));
  if (!days.includes(ui.day)) ui.day = days[0];
  h += '<main>';
  h += '<section class="step"><h2><span class="num">1</span>' + (wash ? 'Welcher Stock?' : 'Was möchtest du reservieren?') + '</h2><div class="choices">' +
    group.map(r => '<button class="opt" data-a="res" data-v="' + r.id + '" aria-pressed="' + (r.id === resId) + '"><b>' + esc(r.name) + '</b><small>' + esc(r.hint || CATS[r.cat]) + '</small></button>').join('') + '</div></section>';
  h += '<section class="step"><h2><span class="num">2</span>An welchem Tag?</h2><div class="days">' +
    days.map((d, i) => '<button class="opt" data-a="day" data-v="' + d + '" aria-pressed="' + (d === ui.day) + '"><small>' + (i === 0 ? 'Heute' : esc(fmt(d, { weekday: 'short' }))) + '</small><b>' + esc(fmt(d, { day: 'numeric', month: 'numeric' })) + '</b></button>').join('') + '</div>' +
    (ui.more ? '' : '<button class="btn quiet" data-a="more">Weitere Tage zeigen</button>') + '</section>';

  const lo = loOf(res);
  if (wash && !res.dayOnly && lo < res.close && (!ui.sel || ui.sel.from < lo || ui.sel.to > res.close)) {
    let f = lo; while (f < res.close - 1 && !isFree(resId, ui.day, f, f + 1)) f++;
    ui.sel = { from: f, to: f + 1 };
  }
  const dayFree = isFree(resId, ui.day, res.open, res.close);
  const full = ui.sel && ui.sel.from === res.open && ui.sel.to === res.close;
  h += '<section class="step"><h2><span class="num">3</span>Von wann bis wann?</h2>';
  if (res.dayOnly) {
    const b = S.bookings.find(x => x.res === resId && x.date === ui.day);
    h += '<p class="muted">' + esc(resLabel(res)) + ' gibt es nur für den ganzen Tag.</p><div class="hours">' +
      (b ? '<div class="slot ' + (b.by === S.user ? 'mine' : 'taken') + '"><span class="t">Ganzer Tag</span><span class="s">' + (b.by === S.user ? ic('check') + 'Meine Reservation' : 'Belegt · ' + esc(b.by)) + '</span></div>'
         : '<button class="slot' + (full ? ' picked' : '') + '" data-a="allday" aria-pressed="' + !!full + '"><span class="t">Ganzer Tag</span><span class="s">' + (full ? ic('check') + 'Ausgewählt' : 'Frei') + '</span></button>') + '</div>';
  } else if (wash) {
    h += washWheels(res, lo, dayFree, full);
  } else {
    const blocks = dayBlocks(res, ui.day);
    h += '<p class="muted">Tippe die erste Stunde an und dann die letzte. Für nur 1 Stunde reicht ein Antippen.</p>' +
      '<button class="btn' + (full ? ' primary' : '') + '" data-a="allday"' + (dayFree ? '' : ' disabled') + '>' + (full ? ic('check') : '') + 'Ganzer Tag (' + span(res.open, res.close) + ')</button>' +
      (dayFree ? '' : '<p class="muted">Der ganze Tag geht nicht, weil schon etwas reserviert ist.</p>') +
      '<div class="hours">' + (blocks.length ? '' : '<p class="muted">Heute ist nichts mehr frei.</p>') + blocks.map(k => {
        const t = '<span class="t">' + span(k.from, k.to) + '</span>';
        if (k.b && k.b.by === S.user) return '<div class="slot mine">' + t + '<span class="s">' + ic('check') + 'Meine Reservation</span></div>';
        if (k.b) { const ev = k.b.ev && S.events.find(e => e.id === k.b.ev); return '<div class="slot taken">' + t + '<span class="s">Belegt · ' + esc(ev ? 'Anlass «' + ev.title + '»' : k.b.by) + '</span></div>'; }
        const picked = ui.sel && k.from >= ui.sel.from && k.from < ui.sel.to;
        return '<button class="slot' + (picked ? ' picked' : '') + '" data-a="hour" data-v="' + k.from + '" aria-pressed="' + !!picked + '">' + t + '<span class="s">' + (picked ? ic('check') + 'Ausgewählt' : 'Frei') + '</span></button>';
      }).join('') + '</div>';
  }
  h += '</section>';
  if (ui.sel && (!wash || (lo < res.close && isFree(resId, ui.day, ui.sel.from, ui.sel.to)))) {
    h += '<section class="confirm" id="confirm"><h2>Stimmt das so?</h2><p><b>' + esc(resLabel(res)) + '</b><br>' + esc(longDate(ui.day)) + '<br>' +
      esc(full ? 'Ganzer Tag' : span(ui.sel.from, ui.sel.to) + ' (' + hoursText(ui.sel.to - ui.sel.from) + ')') + '</p>' + (wash ? repeatHtml() : '') +
      '<div class="row"><button class="btn primary grow" data-a="book">Jetzt reservieren</button><button class="btn quiet" data-a="unpick">Abbrechen</button></div></section>';
  }
  return h + '</main>';
}

      '<div><label for="rs-name">Name</label><input type="text" id="rs-name" maxlength="40" value="' + esc(r.name) + '"></div>' +
      '<div><label for="rs-cat">Art</label><select id="rs-cat">' + Object.keys(CATS).map(k => '<option value="' + k + '"' + (k === r.cat ? ' selected' : '') + '>' + CATS[k] + '</option>').join('') + '</select></div>' +
      '<div><label for="rs-hint">Hinweis <small>(freiwillig, zum Beispiel der Preis)</small></label><input type="text" id="rs-hint" maxlength="60" value="' + esc(r.hint) + '"></div>' +
      '<div class="two"><div><label for="rs-open">Frühestens ab</label><select id="rs-open">' + hourOptions(0, 23, r.open) + '</select></div>' +
      '<div><label for="rs-close">Spätestens bis</label><select id="rs-close">' + hourOptions(1, 24, r.close) + '</select></div></div>' +
      '<label class="check"><input type="checkbox" id="rs-day"' + (r.dayOnly ? ' checked' : '') + '> Nur für den ganzen Tag (zum Beispiel Gästezimmer)</label>' +
      '<p class="err" id="rs-err" role="alert"></p>' +
      '<div class="row"><button class="btn primary grow" type="submit">Speichern</button><button class="btn quiet" type="button" data-a="edit-close">Abbrechen</button></div></form>';
  } else {
    h += '<button class="btn primary wide" data-a="edit" data-v="new">Neu hinzufügen</button>';
  }
  h += '<ul class="list">' + S.resources.map(r =>
    '<li><div class="grow"><div class="when">' + esc(resLabel(r)) + '</div><div class="muted">' + esc(CATS[r.cat]) + ' · ' + (r.dayOnly ? 'nur ganzer Tag' : span(r.open, r.close) + ', ab 1 Stunde') + (r.hint ? ' · ' + esc(r.hint) : '') + '</div></div>' +
    '<span class="row"><button class="btn" data-a="edit" data-v="' + r.id + '">Bearbeiten</button>' + delButtons('res', r.id, 'Löschen', 'Ja, mit allen Reservationen löschen') + '</span></li>').join('') + '</ul></section>';
  h += '<section class="stack" aria-labelledby="ad-c"><h2 id="ad-c">Kontakt</h2><form id="ctform" class="card" novalidate>' +
    '<div><label for="ct-email">E-Mail der Admins</label><input type="email" id="ct-email" value="' + esc(S.contact.email) + '"></div>' +
    '<div><label for="ct-wa">Einladungslink der WhatsApp-Gruppe</label><input type="url" id="ct-wa" placeholder="https://chat.whatsapp.com/..." value="' + esc(S.contact.whatsapp) + '"></div>' +
    '<p class="muted">Leer lassen, solange es das noch nicht gibt. Auf der Startseite steht dann «folgt noch».</p>' +
    '<p class="err" id="ct-err" role="alert"></p><button class="btn primary" type="submit">Kontakt speichern</button></form></section>';
  h += '<p class="muted">Mitteilungen für die Infotafel schreibst du auf der Startseite.</p>';
  return h + '</main>';
}

function navHtml(cur) {
  return '<nav class="bar" aria-label="Hauptmenü"><ul>' + navItems().map(n =>
    '<li><a href="#' + n[0] + '"' + (n[0] === cur ? ' aria-current="page"' : '') + '>' + ic(n[0]) + '<span>' + n[1] + '</span></a></li>').join('') + '</ul></nav>';
}

function render() {
  const app = document.getElementById('app');
  if (!S.user) { app.className = 'login'; app.innerHTML = loginView(); return; }
  const r = route();
  app.className = '';
  app.innerHTML = (r === 'start' ? startView() : r === 'reservieren' || r === 'waschen' ? bookingView(r) : r === 'anlaesse' ? eventsView() : adminView()) + navHtml(r);
  syncWheels();
}
let wheelTimer;
document.addEventListener('scroll', e => {
  const w = e.target; if (!w.classList || !w.classList.contains('wheel')) return;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    const vals = w.dataset.vals.split(',').map(Number);
    if (setWheel(w.id, vals[clamp(Math.round(w.scrollTop / WH), 0, vals.length - 1)])) render();
  }, 150);
}, true);

/* ---------- Actions ---------- */
function removeByKey(key) {
  const [kind, id] = key.split(':');
  if (kind === 'series') { S.bookings = S.bookings.filter(b => !(b.series === id && b.date >= today())); toast('Alle Termine abgesagt'); }
  if (kind === 'booking') { S.bookings = S.bookings.filter(b => b.id !== id); toast('Reservation abgesagt'); }
  if (kind === 'event') { S.events = S.events.filter(e => e.id !== id); S.bookings = S.bookings.filter(b => b.ev !== id); toast('Anlass abgesagt, Raum wieder frei'); }
  if (kind === 'post') { S.posts = S.posts.filter(p => p.id !== id); toast('Mitteilung gelöscht'); }
  if (kind === 'res') { S.resources = S.resources.filter(r => r.id !== id); S.bookings = S.bookings.filter(b => b.res !== id); toast('Gelöscht'); }
  save();
}
function pickHour(res, h) {
  const s = ui.sel;
  if (!s) { ui.sel = { from: h, to: h + 1 }; return; }
  if (h >= s.from && h < s.to) { ui.sel = s.to - s.from === 1 ? null : { from: h, to: h + 1 }; return; }
  const from = Math.min(s.from, h), to = Math.max(s.to, h + 1);
  if (isFree(res.id, ui.day, from, to)) ui.sel = { from, to };
  else { ui.sel = { from: h, to: h + 1 }; toast('Dazwischen ist schon etwas reserviert'); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, r = route();
  const res = (r === 'reservieren' || r === 'waschen') ? resOf(ui.res[r]) : null;
  if (a === 'showpass') { document.getElementById('lg-pass').type = el.checked ? 'text' : 'password'; return; }
  if (a === 'copymail') {
    const done = () => toast('Adresse kopiert');
    const fallback = () => { const range = document.createRange(); range.selectNodeContents(document.getElementById('mail')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); toast('Adresse ist markiert'); };
    try { navigator.clipboard.writeText(S.contact.email).then(done, fallback); } catch (err) { fallback(); }
    return;
  }
  if (a === 'disp') ui.disp = !ui.disp;
  else if (a === 'size') { P.size = Number(v); saveP(); }
  else if (a === 'theme') { P.theme = v; saveP(); }
  else if (a === 'logout') { S.user = null; S.admin = false; save(); location.hash = ''; }
  else if (a === 'res') { ui.res[r] = v; if (r === 'waschen') { S.lastWash = v; save(); } ui.sel = null; }
  else if (a === 'day') { ui.day = v; ui.sel = null; }
  else if (a === 'more') ui.more = true;
  else if (a === 'hour' && res) pickHour(res, Number(v));
  else if (a === 'allday' && res) { const full = ui.sel && ui.sel.from === res.open && ui.sel.to === res.close; ui.sel = full ? null : { from: res.open, to: res.close }; }
  else if (a === 'unpick') ui.sel = null;
  else if (a === 'wstep' && ui.sel) { const x = v.split(':'); setWheel(x[0], (x[0] === 'wf' ? ui.sel.from : ui.sel.to) + Number(x[1])); }
  else if (a === 'wpick') { const x = v.split(':'); setWheel(x[0], Number(x[1])); }
  else if (a === 'rep') ui.rep.every = Number(v);
  else if (a === 'repm') ui.rep.months = Number(v);
  else if (a === 'book' && res && ui.sel) {
    const dates = r === 'waschen' ? occurrences(ui.day, ui.rep.every, ui.rep.months) : [ui.day];
    const series = dates.length > 1 ? uid('s') : null; let ok = 0;
    dates.forEach(d => {
      if (!isFree(res.id, d, ui.sel.from, ui.sel.to)) return;
      const b = { id: uid('b'), res: res.id, date: d, from: ui.sel.from, to: ui.sel.to, by: S.user };
      if (series) { b.series = series; b.every = ui.rep.every; }
      S.bookings.push(b); ok++;
    });
    save();
    toast(dates.length === 1 ? (ok ? 'Reserviert für ' + shortDate(ui.day) : 'Das ist leider schon belegt') : ok + ' Termine reserviert' + (ok < dates.length ? ', ' + (dates.length - ok) + ' waren schon belegt' : ''));
    ui.sel = null; ui.rep = { every: 0, months: 4 };
  }
  else if (a === 'del-ask') ui.del = v;
  else if (a === 'del-no') ui.del = null;
  else if (a === 'del-yes') { removeByKey(v); ui.del = null; }
  else if (a === 'form-event') { ui.form = 'event'; ui.img = ''; }
  else if (a === 'form-post') ui.form = 'post';
  else if (a === 'form-close') ui.form = null;
  else if (a === 'edit') ui.edit = v;
  else if (a === 'edit-close') ui.edit = null;
  else if (a === 'going') {
    const ev = S.events.find(x => x.id === v); if (!ev) return;
    if (ev.going.includes(S.user)) { ev.going = ev.going.filter(n => n !== S.user); toast('Abgemeldet'); } else { ev.going.push(S.user); toast('Angemeldet'); }
    save();
  }
  const keep = ['lg-name', 'lg-pass'].map(id => { const f = document.getElementById(id); return f ? f.value : null; });
  render();
  ['lg-name', 'lg-pass'].forEach((id, i) => { const f = document.getElementById(id); if (f && keep[i] != null) f.value = keep[i]; });
  const focus = id => { const f = document.getElementById(id); if (f) f.focus(); };
  if (a === 'hour' && ui.sel) { const c = document.getElementById('confirm'); if (c) c.scrollIntoView({ block: 'nearest' }); }
  if (a === 'form-event') focus('ev-title');
  if (a === 'form-post') focus('po-title');
  if (a === 'edit') { focus('rs-name'); scrollTo(0, 0); }
});

document.addEventListener('change', e => {
  if (e.target.id !== 'ev-img') return;
  const file = e.target.files[0]; const prev = document.getElementById('ev-prev');
  ui.img = ''; prev.hidden = true; if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 900 / im.width); const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      ui.img = c.toDataURL('image/jpeg', 0.72); prev.src = ui.img; prev.hidden = false;
    };
    im.onerror = () => { document.getElementById('ev-err').textContent = 'Dieses Bild lässt sich nicht öffnen. Bitte wähle ein anderes.'; };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const el = id => document.getElementById(id);
  const val = id => el(id).value.trim();
  const fail = (id, msg) => { el(id).textContent = msg; };
  if (e.target.id === 'login') {
    const name = val('lg-name');
    if (!name || !el('lg-pass').value) return fail('lg-err', 'Bitte gib deine Wohnung und dein Passwort ein.');
    S.user = /^wohnung/i.test(name) ? name : 'Wohnung ' + name; S.admin = el('lg-admin').checked;
    save(); render(); scrollTo(0, 0);
  }
  if (e.target.id === 'evform') {
    if (!S.admin) return;
    const title = val('ev-title'), date = val('ev-date'), resId = val('ev-res'), res = resId && resOf(resId);
    const all = el('ev-all').checked || (res && res.dayOnly);
    const from = all ? (res ? res.open : 7) : Number(val('ev-from')), to = all ? (res ? res.close : 22) : Number(val('ev-to'));
    if (!title) return fail('ev-err', 'Bitte gib einen Titel ein.');
    if (!date || date < today()) return fail('ev-err', 'Bitte wähle einen Tag ab heute.');
    if (to <= from) return fail('ev-err', '«Bis» muss später sein als «Von».');
    if (res && (from < res.open || to > res.close)) return fail('ev-err', res.name + ' kann nur von ' + span(res.open, res.close) + ' reserviert werden.');
    if (res && !isFree(res.id, date, from, to)) return fail('ev-err', res.name + ' ist dann schon reserviert. Bitte wähle einen anderen Tag, eine andere Zeit oder einen anderen Ort.');
    const id = uid('e');
    S.events.push({ id, title, date, from, to, all: !!all, res: resId || null, desc: val('ev-desc'), img: ui.img, by: S.user, going: [S.user] });
    if (res) S.bookings.push({ id: uid('b'), res: res.id, date, from, to, by: S.user, ev: id });
    save(); ui.form = null; ui.img = ''; render(); toast(res ? 'Anlass gespeichert, ' + res.name + ' reserviert' : 'Anlass gespeichert');
  }
  if (e.target.id === 'postform') {
    if (!val('po-title') || !val('po-body')) return fail('po-err', 'Bitte gib Titel und Text ein.');
    S.posts.push({ id: uid('p'), title: val('po-title'), body: val('po-body'), important: el('po-imp').checked, by: 'Vorstand', date: today() });
    save(); ui.form = null; render(); toast('Mitteilung hängt an der Infotafel');
  }
  if (e.target.id === 'resform') {
    const name = val('rs-name'), open = Number(val('rs-open')), close = Number(val('rs-close'));
    if (!name) return fail('rs-err', 'Bitte gib einen Namen ein.');
    if (close <= open) return fail('rs-err', '«Spätestens bis» muss später sein als «Frühestens ab».');
    const data = { name, cat: val('rs-cat'), hint: val('rs-hint'), open, close, dayOnly: el('rs-day').checked };
    if (ui.edit === 'new') S.resources.push(Object.assign({ id: uid('r') }, data)); else Object.assign(resOf(ui.edit), data);
    save(); ui.edit = null; render(); toast('Gespeichert');
  }
  if (e.target.id === 'ctform') {
    const email = val('ct-email'), wa = val('ct-wa');
    if (email && !/^\S+@\S+\.\S+$/.test(email)) return fail('ct-err', 'Diese E-Mail-Adresse sieht nicht richtig aus.');
    if (wa && !/^https:\/\//.test(wa)) return fail('ct-err', 'Der Link muss mit https:// beginnen.');
    S.contact = { email, whatsapp: wa }; save(); render(); toast('Kontakt gespeichert');
  }
});

addEventListener('hashchange', () => { ui.disp = false; ui.sel = null; ui.form = null; ui.edit = null; ui.del = null; ui.day = today(); render(); scrollTo(0, 0); });
render();
</script>
