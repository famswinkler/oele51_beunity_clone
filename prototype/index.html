<title>Oele51 Hausverein App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column. Start page opens with the info board (events first, with picture), then three wide reservation buttons. Labelled bottom bar on every screen. */
:root {
  --bg: #F1F4EC;
  --surface: #FFFFFF;
  --ink: #0F1A1A;
  --muted: #36423F;
  --green: #2E4A27;
  --on-green: #FFFFFF;
  --green-soft: #DCE6D2;
  --sage: #5E6E55;
  --peach: #C8A898;
  --peach-soft: #F6E4DA;
  --line: #8A977F;
  --danger: #8C2414;
  --plate: #FFFFFF;
  --font: "Atkinson Hyperlegible", "Segoe UI", Verdana, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1414; --surface: #1B2323; --ink: #FFFFFF; --muted: #D2DAD0;
    --green: #B9D3A8; --on-green: #0C140C; --green-soft: #2C3A30; --sage: #A3B197;
    --peach: #E2C2B2; --peach-soft: #3E3028; --line: #7F8C83; --danger: #FFB0A4;
    --plate: #FFFFFF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1414; --surface: #1B2323; --ink: #FFFFFF; --muted: #D2DAD0;
  --green: #B9D3A8; --on-green: #0C140C; --green-soft: #2C3A30; --sage: #A3B197;
  --peach: #E2C2B2; --peach-soft: #3E3028; --line: #7F8C83; --danger: #FFB0A4;
  --plate: #FFFFFF; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1.125rem; line-height: 1.5; }
#app {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 120px;
  display: flex; flex-direction: column; gap: 24px;
}
#app.login { padding-block: 24px 32px; }
main { display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.9rem; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 1.4rem; line-height: 1.25; text-wrap: balance; }
h3 { font-size: 1.15rem; line-height: 1.3; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row > .grow { flex: 1 1 200px; min-width: 0; }
svg.ic { width: 1.6em; height: 1.6em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

button, .btn, input, select, textarea { font: inherit; color: inherit; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 10px 22px; border-radius: 12px;
  border: 2px solid var(--green); background: var(--surface); color: var(--ink);
  font-weight: 700; text-decoration: none; cursor: pointer; text-align: center;
}
.btn.primary { background: var(--green); color: var(--on-green); }
.btn.quiet { border-color: var(--line); font-weight: 400; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.wide { width: 100%; }
.btn[disabled] { border-style: dashed; border-color: var(--line); color: var(--muted); background: transparent; cursor: not-allowed; }
:focus-visible { outline: 4px solid var(--peach); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.top .name { flex: 1 1 auto; }
.row > .opt { flex: 1 1 8rem; align-items: center; text-align: center; }
.row > .opt b { hyphens: manual; overflow-wrap: normal; }
.loginbox > .btn.disp { align-self: flex-end; }
.plate { background: var(--plate); border-radius: 12px; padding: 6px 10px; flex: none; line-height: 0; }
.plate img { height: 52px; width: auto; }
.top .name { font-weight: 700; font-size: 1.25rem; line-height: 1.15; }
.top .name small { display: block; font-weight: 400; font-size: 1rem; color: var(--muted); }
.hello { display: flex; flex-direction: column; gap: 4px; }
.demo { background: var(--peach-soft); border-radius: 10px; padding: 10px 14px; font-size: .95rem; }

.loginbox { background: var(--surface); border-radius: 20px; padding: 28px 22px; display: flex; flex-direction: column; gap: 20px; }
.loginbox .logo { align-self: center; background: var(--plate); border-radius: 16px; padding: 8px; line-height: 0; }
.loginbox .logo img { width: 230px; height: auto; }
label { font-weight: 700; display: block; margin-bottom: 6px; }
label small { font-weight: 400; color: var(--muted); font-size: .95rem; }
input[type=text], input[type=password], input[type=date], input[type=email], input[type=url], select, textarea {
  width: 100%; min-height: 56px; padding: 12px 14px; border-radius: 12px;
  border: 2px solid var(--sage); background: var(--surface);
}
input[type=file] { width: 100%; }
textarea { min-height: 120px; resize: vertical; }
.check { display: flex; gap: 12px; align-items: center; font-weight: 400; margin: 0; min-height: 44px; }
.check input { width: 26px; height: 26px; accent-color: var(--green); flex: none; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.err { color: var(--danger); font-weight: 700; }
.err:empty { display: none; }

/* Info board on the start page */
.board { background: var(--surface); border-radius: 20px; padding: 20px 18px; display: flex; flex-direction: column; gap: 18px; }
.board > h2 { display: flex; align-items: center; gap: 10px; }
.pic { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; object-fit: cover; display: block; }
.pic.ph { background: var(--green-soft); color: var(--green); display: grid; place-items: center; }
.pic.ph svg { width: 76px; height: 76px; stroke-width: 1.5; }
.event { display: flex; flex-direction: column; gap: 12px; }
.meta { display: flex; flex-direction: column; gap: 6px; }
.meta > span { display: flex; gap: 8px; align-items: flex-start; }
.meta > span > span { min-width: 0; }
.note { border-top: 2px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 8px; }
.pill { display: inline-flex; align-items: center; align-self: flex-start; padding: 2px 12px; border-radius: 999px; font-size: .9rem; font-weight: 700; letter-spacing: .03em; background: var(--peach); color: #2B2320; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 65ch; }

.tiles { display: flex; flex-direction: column; gap: 12px; }
.tile {
  display: flex; align-items: center; gap: 16px; min-height: 88px; padding: 14px 16px; border-radius: var(--r);
  background: var(--surface); border: 2px solid var(--line); text-decoration: none; color: var(--ink);
}
.tile:hover { border-color: var(--green); }
.tile .badge { background: var(--green-soft); color: var(--green); border-radius: 50%; width: 58px; height: 58px; display: grid; place-items: center; flex: none; }
.tile .badge svg { width: 32px; height: 32px; }
.tile .txt { min-width: 0; display: flex; flex-direction: column; }
.tile strong { font-size: 1.2rem; line-height: 1.25; }
.tile .muted { font-size: .98rem; line-height: 1.35; }

.list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--line); }
.list > li { padding: 14px 0; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.list > li > .grow { flex: 1 1 220px; min-width: 0; }
.when { font-weight: 700; font-variant-numeric: tabular-nums; }
.contact { background: var(--green-soft); border-radius: var(--r); padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; }
.mail { font-weight: 700; user-select: all; overflow-wrap: anywhere; }

/* Booking */
.step { display: flex; flex-direction: column; gap: 12px; }
.step > h2 { display: flex; gap: 12px; align-items: center; }
.num { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 1.1rem; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr)); gap: 10px; }
.opt {
  min-height: 64px; padding: 10px 12px; border-radius: 12px; cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); text-align: left;
  display: flex; flex-direction: column; justify-content: center; gap: 2px; line-height: 1.25;
}
.opt b { overflow-wrap: anywhere; hyphens: auto; }
.opt small { font-size: .9rem; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--green); background: var(--green); color: var(--on-green); }
.opt[aria-pressed="true"] small { color: var(--on-green); }
.days .opt { text-align: center; align-items: center; font-variant-numeric: tabular-nums; }
.hours { display: flex; flex-direction: column; gap: 6px; }
.slot {
  min-height: 54px; padding: 8px 16px; border-radius: 12px; text-align: left; width: 100%;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 2px 16px;
  background: var(--surface); border: 2px solid var(--green); cursor: pointer;
}
.slot .t { font-weight: 700; font-variant-numeric: tabular-nums; }
.slot .s { display: inline-flex; align-items: center; gap: 8px; }
.slot.taken { border: 2px dashed var(--line); background: transparent; color: var(--muted); cursor: default; }
.slot.mine { background: var(--green-soft); cursor: default; }
.slot.picked { background: var(--green); color: var(--on-green); }
.wheels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.wheelbox { display: flex; flex-direction: column; gap: 8px; text-align: center; }
.wheelbox > b { font-size: 1.2rem; }
.wheel {
  height: 172px; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none;
  padding-block: 56px; border: 2px solid var(--sage); border-radius: 12px; background: var(--surface);
}
.wheel::-webkit-scrollbar { display: none; }
.wi { height: 56px; display: grid; place-items: center; scroll-snap-align: center; font-size: 1.3rem; font-variant-numeric: tabular-nums; color: var(--muted); cursor: pointer; }
.wi.on { background: var(--green); color: var(--on-green); font-weight: 700; }
.dur { font-size: 1.25rem; text-align: center; font-variant-numeric: tabular-nums; }
.confirm { background: var(--peach-soft); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
#ev-prev { max-height: 180px; border-radius: 12px; }

nav.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 2px solid var(--line);
  padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
}
nav.bar ul { list-style: none; margin: 0 auto; padding: 0; max-width: 760px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
nav.bar a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 66px; border-radius: 12px; text-decoration: none; color: var(--ink);
  font-size: min(.84rem, 15px); font-weight: 700; text-align: center; line-height: 1.15; overflow-wrap: anywhere;
}
nav.bar a[aria-current="page"] { background: var(--green); color: var(--on-green); }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  background: var(--ink); color: var(--bg); padding: 14px 22px; border-radius: 12px; font-weight: 700;
  max-width: calc(100% - 32px); text-align: center;
}
@media (prefers-reduced-motion: no-preference) { .tile, .opt, .slot, .btn { transition: border-color .15s, background-color .15s; } }

/* page basics (the demo host adds these itself) */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* day status, admin tabs */
.days .opt .st { font-size: .85rem; font-weight: 700; }
.days .opt.day-voll { border-style: dashed; }
.days .opt.day-voll:not([aria-pressed="true"]) b, .days .opt.day-voll:not([aria-pressed="true"]) .st { color: var(--muted); }
.days .opt.day-teils:not([aria-pressed="true"]) { background: var(--peach-soft); }
.tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: 8px; }
.tabs .opt { min-height: 56px; align-items: center; text-align: center; }
.list .pill { vertical-align: middle; }
</style>
<div id="app" lang="de-CH"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>window.OELE_DEMO = true;</script>
<script>
/* Oele51 rules: every check and every change to the data lives here.
   The server runs this file for the real app; the demo runs the same file in the browser. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.OeleCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const CATS = { raum: 'Raum', tisch: 'Tisch', wasch: 'Waschmaschine', anderes: 'Anderes' };
  const pad = n => String(n).padStart(2, '0');
  const span = (a, b) => pad(a) + '–' + pad(b) + ' Uhr';
  const hoursText = n => n === 1 ? '1 Stunde' : n + ' Stunden';

  function fail(msg, status) { const e = new Error(msg); e.status = status || 400; e.expose = true; throw e; }
  function isDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s + 'T12:00:00Z')); }
  function addDays(d, n) { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
  function addMonths(d, n) {
    const x = new Date(d + 'T12:00:00Z'); const day = x.getUTCDate();
    x.setUTCDate(1); x.setUTCMonth(x.getUTCMonth() + n);
    const last = new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 0)).getUTCDate();
    x.setUTCDate(Math.min(day, last)); return x.toISOString().slice(0, 10);
  }
  const int = (v, lo, hi, def) => { v = Number(v); return Number.isInteger(v) ? Math.max(lo, Math.min(hi, v)) : def; };
  const str = (v, max) => String(v == null ? '' : v).trim().slice(0, max);
  const nextId = (s, p) => p + (s.seq++);

  function seed() {
    const s = { v: 1, seq: 1, version: 1, settings: { email: '', whatsapp: '', sender: 'Vorstand' }, users: [], sessions: {}, resources: [], bookings: [], events: [], posts: [] };
    const R = (name, cat, hint, extra) => s.resources.push(Object.assign({ id: nextId(s, 'r'), name, cat, hint, open: 7, close: 22, minH: 1, maxH: 0, dayOnly: false, aheadDays: 125, repeat: false, repeatMonths: 4, active: true }, extra || {}));
    R('Gemeinschaftsraum', 'raum', 'Privater Anlass CHF 20 pro Tag');
    R('Terrasse', 'raum', 'Beim Gemeinschaftsraum');
    R('Gästezimmer', 'raum', 'CHF 20 pro Nacht', { dayOnly: true });
    R('Festtisch 1', 'tisch', 'Beispiel');
    R('Festtisch 2', 'tisch', 'Beispiel');
    ['Erdgeschoss', '1. Stock', '2. Stock', '3. Stock'].forEach(n => R(n, 'wasch', 'Waschmaschine', { repeat: true }));
    return s;
  }

  const findUser = (s, login) => { const l = str(login, 120).toLowerCase(); return s.users.find(u => u.login === l); };
  const resOf = (s, id) => s.resources.find(r => r.id === id);
  const nameOf = (s, id) => { const u = s.users.find(x => x.id === id); return u ? u.name : 'Ehemalige Wohnung'; };
  const clashOf = (s, res, date, from, to, except) => s.bookings.find(b => b.res === res && b.date === date && b.from < to && from < b.to && b.id !== except);

  /* What one logged-in flat is allowed to see. */
  function view(s, ctx) {
    const u = ctx.user, admin = u.role === 'admin', t = ctx.today;
    return {
      version: s.version, today: t, nowHour: ctx.nowHour,
      me: { id: u.id, name: u.name, login: u.login, role: u.role, initial: !!u.initial },
      settings: s.settings,
      resources: s.resources.filter(r => admin || r.active),
      bookings: s.bookings.filter(b => b.date >= t).map(b => ({ id: b.id, res: b.res, date: b.date, from: b.from, to: b.to, by: nameOf(s, b.user), mine: b.user === u.id, ev: b.ev || null, series: b.series || null, every: b.every || 0 })),
      events: s.events.filter(e => e.date >= t).map(e => ({ id: e.id, title: e.title, date: e.date, from: e.from, to: e.to, all: !!e.all, res: e.res, desc: e.desc, img: e.img || '', by: s.settings.sender, going: e.going.length, iGo: e.going.includes(u.id) })),
      posts: s.posts,
      users: admin ? s.users.map(x => ({ id: x.id, login: x.login, name: x.name, role: x.role, initial: !!x.initial })) : undefined
    };
  }

  /* Returns null when the time can be reserved, otherwise { msg, status }. */
  function checkSlot(s, ctx, r, date, from, to, o) {
    o = o || {};
    if (!isDate(date)) return { msg: 'Dieser Tag ist ungültig.' };
    if (date < ctx.today) return { msg: 'Dieser Tag ist schon vorbei.' };
    if (!Number.isInteger(from) || !Number.isInteger(to) || from < r.open || to > r.close || from >= to) return { msg: r.name + ' kann nur von ' + span(r.open, r.close) + ' reserviert werden.' };
    if (!o.event) {
      const whole = from === r.open && to === r.close, dur = to - from;
      if (!r.active) return { msg: r.name + ' kann im Moment nicht reserviert werden.' };
      if (!o.inSeries && date > addDays(ctx.today, r.aheadDays)) return { msg: r.name + ' kann höchstens ' + r.aheadDays + ' Tage im Voraus reserviert werden.' };
      if (r.dayOnly && !whole) return { msg: r.name + ' gibt es nur für den ganzen Tag.' };
      if (dur < r.minH) return { msg: 'Mindestens ' + hoursText(r.minH) + ' reservieren.' };
      if (r.maxH && dur > r.maxH) return { msg: 'Höchstens ' + hoursText(r.maxH) + ' am Stück reservieren.' };
      if (date === ctx.today && !r.dayOnly && from <= ctx.nowHour) return { msg: 'Diese Zeit ist schon vorbei.' };
    }
    const c = clashOf(s, r.id, date, from, to, o.except);
    if (c) return { msg: 'Diese Zeit ist schon reserviert: ' + span(c.from, c.to) + ', ' + nameOf(s, c.user) + '.', status: 409 };
    return null;
  }

  const ACTIONS = {
    book(s, ctx, p) {
      const r = resOf(s, p.res) || fail('Das gibt es nicht mehr.', 404);
      const from = Number(p.from), to = Number(p.to), every = int(p.every, 0, 2, 0);
      const first = checkSlot(s, ctx, r, p.date, from, to);
      if (first) fail(first.msg, first.status);
      const dates = [p.date];
      if (every) {
        if (!r.repeat) fail(r.name + ' lässt sich nicht wiederholt reservieren.');
        const lim = addMonths(ctx.today, int(p.months, 1, r.repeatMonths, r.repeatMonths));
        for (let d = addDays(p.date, 7 * every); d <= lim; d = addDays(d, 7 * every)) dates.push(d);
      }
      const series = dates.length > 1 ? nextId(s, 's') : null; let made = 0;
      dates.forEach((d, i) => {
        if (i && checkSlot(s, ctx, r, d, from, to, { inSeries: true })) return;
        const b = { id: nextId(s, 'b'), res: r.id, date: d, from, to, user: ctx.user.id };
        if (series) { b.series = series; b.every = every; }
        s.bookings.push(b); made++;
      });
      return { made, skipped: dates.length - made };
    },
    cancel(s, ctx, p) {
      const b = s.bookings.find(x => x.id === p.id) || fail('Diese Reservation gibt es nicht mehr.', 404);
      if (b.user !== ctx.user.id && ctx.user.role !== 'admin') fail('Das ist nicht deine Reservation.', 403);
      if (b.ev) fail('Diese Reservation gehört zu einem Anlass. Sag den Anlass ab.');
      s.bookings = s.bookings.filter(x => x !== b); return {};
    },
    cancelSeries(s, ctx, p) {
      const mine = b => b.series === p.series && b.date >= ctx.today && (b.user === ctx.user.id || ctx.user.role === 'admin');
      const n = s.bookings.filter(mine).length; if (!n) fail('Diese Reservationen gibt es nicht mehr.', 404);
      s.bookings = s.bookings.filter(b => !mine(b)); return { removed: n };
    },
    going(s, ctx, p) {
      const e = s.events.find(x => x.id === p.event) || fail('Diesen Anlass gibt es nicht mehr.', 404);
      e.going = e.going.filter(id => id !== ctx.user.id); if (p.on) e.going.push(ctx.user.id); return {};
    },
    password(s, ctx, p) {
      if (!ctx.verify(String(p.old || ''), ctx.user.pw)) fail('Das bisherige Passwort stimmt nicht.');
      if (String(p.new || '').length < 6) fail('Das neue Passwort braucht mindestens 6 Zeichen.');
      ctx.user.pw = ctx.hash(String(p.new)); ctx.user.initial = false; return {};
    },

    /* ----- admins only ----- */
    resSave(s, ctx, p) {
      const name = str(p.name, 40) || fail('Bitte gib einen Namen ein.');
      const open = int(p.open, 0, 23, 7), close = int(p.close, 1, 24, 22);
      if (close <= open) fail('«Spätestens bis» muss später sein als «Frühestens ab».');
      const len = close - open, minH = int(p.minH, 1, 24, 1), maxH = int(p.maxH, 0, 24, 0);
      if (minH > len) fail('Die Mindestdauer ist länger als die Öffnungszeit.');
      if (maxH && maxH < minH) fail('Die Höchstdauer muss mindestens so lang sein wie die Mindestdauer.');

/* ---------- reserving ---------- */
const WH = 56;
const loOf = r => ui.day === D.today ? Math.max(r.open, D.nowHour + 1) : r.open;
function dayState(r, d) {
  let n = 0; D.bookings.forEach(b => { if (b.res === r.id && b.date === d) n += Math.max(0, Math.min(b.to, r.close) - Math.max(b.from, r.open)); });
  return n <= 0 ? 'frei' : n >= r.close - r.open ? 'voll' : 'teils';
}
function wheelHtml(id, label, vals, cur) {
  return '<div class="wheelbox"><b id="' + id + '-l">' + label + '</b>' +
    '<button class="btn quiet" data-a="wstep" data-v="' + id + ':-1" aria-label="' + label + ' eine Stunde früher">' + ic('up') + '</button>' +
    '<div class="wheel" id="' + id + '" role="listbox" tabindex="0" aria-labelledby="' + id + '-l" data-vals="' + vals.join(',') + '">' +
    vals.map(v => '<div class="wi' + (v === cur ? ' on' : '') + '" role="option" aria-selected="' + (v === cur) + '" data-a="wpick" data-v="' + id + ':' + v + '">' + pad(v) + ':00</div>').join('') + '</div>' +
    '<button class="btn quiet" data-a="wstep" data-v="' + id + ':1" aria-label="' + label + ' eine Stunde später">' + ic('down') + '</button></div>';
}
function setWheel(id, v) {
  const r = resOf(ui.res[route()]); if (!r || !ui.sel) return false;
  const lo = loOf(r), min = r.minH, max = r.maxH || 99; let from = ui.sel.from, to = ui.sel.to;
  if (id === 'wf') { from = clamp(v, lo, r.close - min); to = Math.min(r.close, from + clamp(to - from, min, max)); }
  else { to = clamp(v, lo + min, r.close); if (to - from < min) from = to - min; if (to - from > max) from = to - max; from = Math.max(from, lo); }
  const changed = from !== ui.sel.from || to !== ui.sel.to; ui.sel = { from, to }; return changed;
}
function syncWheels() {
  document.querySelectorAll('.wheel').forEach(w => { const on = w.querySelector('.on'); w.scrollTop = on ? Array.prototype.indexOf.call(w.children, on) * WH : 0; });
}
function occurrences(r) {
  const out = [ui.day]; if (!ui.rep.every || !r.repeat) return out;
  const lim = core.addMonths(D.today, Math.min(ui.rep.months, r.repeatMonths));
  for (let d = core.addDays(ui.day, 7 * ui.rep.every); d <= lim; d = core.addDays(d, 7 * ui.rep.every)) out.push(d);
  return out;
}
function repeatHtml(r) {
  const occ = occurrences(r), months = [1, 2, 3, 4, 6, 9, 12].filter(m => m <= r.repeatMonths);
  return '<div class="stack"><b>Wiederholen?</b>' + optsRow('rep', ui.rep.every, [[0, 'Nur dieses Mal'], [1, 'Jede Woche'], [2, 'Alle 2 Wochen']]) +
    (ui.rep.every ? '<b>Wie lange?</b>' + optsRow('repm', Math.min(ui.rep.months, r.repeatMonths), months.map(m => [m, m === 1 ? '1 Monat' : m + ' Monate'])) +
      '<p>' + occ.length + ' Termine, der letzte am ' + esc(longDate(occ[occ.length - 1])) + '. Mehr als ' + (r.repeatMonths === 1 ? '1 Monat' : r.repeatMonths + ' Monate') + ' im Voraus geht nicht.</p>' : '') + '</div>';
}

function bookingView(kind) {
  const wash = kind === 'waschen';
  const group = D.resources.filter(r => r.active && (r.cat === 'wasch') === wash);
  let h = header(wash ? 'Waschmaschine reservieren' : 'Raum oder Tisch reservieren', 'Drei Schritte: auswählen, Tag antippen, Zeit einstellen.');
  if (!group.length) return h + '<main><p class="muted">Hier ist noch nichts eingerichtet.' + (admin() ? ' Im Admin-Bereich kannst du etwas hinzufügen.' : '') + '</p></main>';
  let resId = ui.res[kind]; if (!resId) { try { resId = localStorage.getItem('oele51-last-' + kind); } catch (e) {} }
  if (!group.some(r => r.id === resId)) resId = group[0].id;
  ui.res[kind] = resId;
  const r = resOf(resId), last = core.addDays(D.today, r.aheadDays);
  if (!ui.day || ui.day < D.today) ui.day = D.today;
  if (ui.day > last) { ui.day = D.today; ui.page = 0; }
  const days = []; for (let i = 0; i < 14; i++) { const d = core.addDays(D.today, ui.page * 14 + i); if (d <= last) days.push(d); }
  if (!days.includes(ui.day)) { ui.day = days[0]; ui.sel = null; }

  h += '<main>';
  h += '<section class="step"><h2><span class="num">1</span>' + (wash ? 'Welcher Stock?' : 'Was möchtest du reservieren?') + '</h2><div class="choices">' +
    group.map(x => '<button class="opt" data-a="res" data-v="' + x.id + '" aria-pressed="' + (x.id === resId) + '"><b>' + esc(x.name) + '</b><small>' + esc(x.hint || CATS[x.cat]) + '</small></button>').join('') + '</div></section>';

  h += '<section class="step"><h2><span class="num">2</span>An welchem Tag?</h2><div class="days">' +
    days.map(d => { const st = dayState(r, d); return '<button class="opt day-' + st + '" data-a="day" data-v="' + d + '" aria-pressed="' + (d === ui.day) + '"><small>' + (d === D.today ? 'Heute' : esc(fmt(d, { weekday: 'short' }))) + '</small><b>' + esc(fmt(d, { day: 'numeric', month: 'numeric' })) + '</b><small class="st">' + st + '</small></button>'; }).join('') + '</div>' +
    '<p class="muted">«frei»: noch alles offen. «teils»: ein Teil ist reserviert. «voll»: nichts mehr frei.</p>' +
    '<div class="row">' + (ui.page > 0 ? '<button class="btn quiet grow" data-a="page" data-v="-1">Frühere Tage</button>' : '') +
    (core.addDays(D.today, (ui.page + 1) * 14) <= last ? '<button class="btn quiet grow" data-a="page" data-v="1">Spätere Tage</button>' : '') + '</div></section>';

  const lo = loOf(r), taken = D.bookings.filter(b => b.res === resId && b.date === ui.day).sort(byTime);
  const dayFree = !taken.length, fits = r.dayOnly ? true : lo + r.minH <= r.close;
  if (!r.dayOnly && fits && (!ui.sel || ui.sel.from < lo || ui.sel.to > r.close || ui.sel.to - ui.sel.from < r.minH)) {
    let f = lo; while (f + r.minH < r.close && !isFree(resId, ui.day, f, f + r.minH)) f++;
    ui.sel = { from: f, to: f + r.minH };
  }
  if (r.dayOnly && ui.sel && !(ui.sel.from === r.open && ui.sel.to === r.close)) ui.sel = null;
  const sel = ui.sel, full = sel && sel.from === r.open && sel.to === r.close;

  h += '<section class="step"><h2><span class="num">3</span>Von wann bis wann?</h2>';
  h += '<div class="stack"><b>Schon reserviert am ' + esc(longDate(ui.day)) + '</b>' + (taken.length
    ? '<ul class="list">' + taken.map(b => { const ev = b.ev && D.events.find(e => e.id === b.ev); return '<li><span class="when">' + esc(timeLabel(b, r)) + '</span><span>' + esc(b.mine && !ev ? 'Meine Reservation' : ev ? 'Anlass «' + ev.title + '»' : b.by) + '</span></li>'; }).join('') + '</ul>'
    : '<p class="muted">Noch nichts. Der ganze Tag ist frei.</p>') + '</div>';
  if (r.dayOnly) {
    h += '<p class="muted">' + esc(resLabel(r)) + ' gibt es nur für den ganzen Tag.</p>' +
      (dayFree ? '<button class="slot' + (full ? ' picked' : '') + '" data-a="allday" aria-pressed="' + !!full + '"><span class="t">Ganzer Tag</span><span class="s">' + (full ? ic('check') + 'Ausgewählt' : 'Frei') + '</span></button>' : '');
  } else if (!fits) {
    h += '<p class="muted">Heute geht nichts mehr. Wähle einen anderen Tag.</p>';
  } else {
    const fv = [], tv = []; for (let i = lo; i <= r.close - r.minH; i++) fv.push(i); for (let i = lo + r.minH; i <= r.close; i++) tv.push(i);
    const clash = taken.filter(b => b.from < sel.to && sel.from < b.to);
    const limits = (r.minH > 1 ? 'Mindestens ' + hoursText(r.minH) + '. ' : '') + (r.maxH ? 'Höchstens ' + hoursText(r.maxH) + ' am Stück.' : '');
    h += '<p class="muted">Dreh an den Rädern oder tippe auf die Pfeile. ' + limits + '</p>' +
      '<div class="wheels">' + wheelHtml('wf', 'Von', fv, sel.from) + wheelHtml('wt', 'Bis', tv, sel.to) + '</div>' +
      '<p class="dur"><b>' + span(sel.from, sel.to) + '</b> · ' + hoursText(sel.to - sel.from) + '</p>' +
      (dayFree && lo === r.open && !r.maxH ? '<button class="btn' + (full ? ' primary' : '') + '" data-a="allday">' + (full ? ic('check') : '') + 'Ganzer Tag (' + span(r.open, r.close) + ')</button>' : '') +
      (clash.length ? '<p class="err">In dieser Zeit ist schon reserviert (' + clash.map(b => span(b.from, b.to)).join(', ') + '). Wähle eine andere Zeit.</p>' : '');
  }
  h += '</section>';
  if (sel && fits && isFree(resId, ui.day, sel.from, sel.to)) {
    h += '<section class="confirm" id="confirm"><h2>Stimmt das so?</h2><p><b>' + esc(resLabel(r)) + '</b><br>' + esc(longDate(ui.day)) + '<br>' +
      esc(full ? 'Ganzer Tag' : span(sel.from, sel.to) + ' (' + hoursText(sel.to - sel.from) + ')') + '</p>' + (r.repeat ? repeatHtml(r) : '') +
      '<button class="btn primary wide" data-a="book">Jetzt reservieren</button></section>';
  }
  return h + '</main>';
}

  const ed = editing('users'); let h = '<p class="muted">Ein Konto pro Wohnung. Du gibst ein Startpasswort, das die Wohnung später selber ändern kann. Als Benutzername geht jede E-Mail-Adresse oder ein kurzer Name wie «1.06».</p>';
  if (ed) {
    const u = ed.id === 'new' ? { name: '', login: '', role: 'resident' } : D.users.find(x => x.id === ed.id);
    h += '<form id="userform" class="card" novalidate><h3>' + (ed.id === 'new' ? 'Neues Konto' : esc(u.name) + ' bearbeiten') + '</h3>' +
      field('us-name', 'Name', input('us-name', u.name, 'text', ' maxlength="40"'), 'so steht es bei Reservationen, zum Beispiel «Wohnung 1.06»') +
      field('us-login', 'E-Mail oder Benutzername', input('us-login', u.login, 'text', ' maxlength="120" autocapitalize="none" spellcheck="false"')) +
      field('us-role', 'Rolle', selectHtml('us-role', [['resident', 'Bewohner'], ['admin', 'Admin']], u.role)) +
      field('us-pw', ed.id === 'new' ? 'Startpasswort' : 'Neues Startpasswort', input('us-pw', '', 'text', ' autocomplete="off" spellcheck="false"'), ed.id === 'new' ? 'mindestens 6 Zeichen' : 'leer lassen, wenn das Passwort bleiben soll') +
      '<button class="btn quiet" type="button" data-a="pw-suggest">Passwort vorschlagen</button>' +
      '<p class="err" id="us-err" role="alert"></p>' + formButtons('Konto speichern') + '</form>';
  } else h += addButton('users', 'Neues Konto anlegen');
  return h + '<ul class="list">' + D.users.map(u =>
    '<li><div class="grow"><div class="when">' + esc(u.name) + (u.role === 'admin' ? ' <span class="pill">ADMIN</span>' : '') + '</div><div class="muted">' + esc(u.login) + (u.initial ? ' · benutzt noch das Startpasswort' : '') + '</div></div>' +
    '<span class="row"><button class="btn" data-a="edit" data-v="users:' + u.id + '">Bearbeiten</button>' + (u.id === D.me.id ? '' : delButtons('user', u.id, 'Löschen', 'Ja, Konto und Reservationen löschen')) + '</span></li>').join('') + '</ul>';
}

function adminBookings() {
  const list = D.bookings.slice().sort(byTime);
  return '<p class="muted">Alle kommenden Reservationen im Haus. Du kannst jede absagen.</p>' + (list.length ? bookingRows(list, true) : '<p class="muted">Es gibt keine Reservationen.</p>');
}

function adminContact() {
  const c = D.settings;
  return '<form id="ctform" class="card" novalidate>' +
    field('ct-email', 'E-Mail der Admins', input('ct-email', c.email, 'email')) +
    field('ct-wa', 'Einladungslink der WhatsApp-Gruppe', input('ct-wa', c.whatsapp, 'url', ' placeholder="https://chat.whatsapp.com/..."')) +
    field('ct-sender', 'Absender von Mitteilungen und Anlässen', input('ct-sender', c.sender, 'text', ' maxlength="40"')) +
    '<p class="muted">E-Mail und WhatsApp leer lassen, solange es sie noch nicht gibt. Auf der Startseite steht dann «folgt noch».</p>' +
    '<p class="err" id="ct-err" role="alert"></p><button class="btn primary" type="submit">Speichern</button></form>';
}

function adminView() {
  const views = { res: adminRes, events: adminEvents, posts: adminPosts, users: adminUsers, bookings: adminBookings, contact: adminContact };
  return header('Admin-Bereich', 'Nur für Admins.') + '<main><div class="tabs">' +
    TABS.map(t => '<button class="opt" data-a="tab" data-v="' + t[0] + '" aria-pressed="' + (ui.tab === t[0]) + '"><b>' + t[1] + '</b></button>').join('') + '</div>' +
    '<section class="stack"><h2>' + TABS.find(t => t[0] === ui.tab)[1] + '</h2>' + views[ui.tab]() + '</section></main>';
}

/* ---------- drawing ---------- */
function navHtml(cur) {
  return '<nav class="bar" aria-label="Hauptmenü"><ul>' + navItems().map(n =>
    '<li><a href="#' + n[0] + '"' + (n[0] === cur ? ' aria-current="page"' : '') + '>' + ic(n[0]) + '<span>' + n[1] + '</span></a></li>').join('') + '</ul></nav>';
}
function render() {
  const app = $('app'); ui.stale = false;
  if (!booted) { app.className = 'login'; app.innerHTML = '<p class="muted">Einen Moment …</p>'; return; }
  const keep = ['lg-name', 'lg-pass'].map(id => $(id) ? $(id).value : null);
  if (!D) { app.className = 'login'; app.innerHTML = loginView(); ['lg-name', 'lg-pass'].forEach((id, i) => { if (keep[i] != null) $(id).value = keep[i]; }); return; }
  const r = route(); app.className = '';
  app.innerHTML = (r === 'start' ? startView() : r === 'reservieren' || r === 'waschen' ? bookingView(r) : r === 'anlaesse' ? eventsView() : adminView()) + navHtml(r);
  syncWheels();
}
/* New data from the server: show it at once, unless someone is in the middle of typing. */
const typing = () => ui.edit || ui.form || /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
function take(d) { const changed = !D || d.version !== D.version || d.today !== D.today || d.nowHour !== D.nowHour || d.me.id !== D.me.id; D = d; return changed; }
async function refresh() {
  try { if (take(await api.state())) { if (typing()) ui.stale = true; else render(); } }
  catch (e) { if (e.status === 401 && D) { D = null; render(); } }
}
async function run(name, p, o) {
  o = o || {};
  try {
    const out = await api.act(name, p); take(out.state);
    if (o.close) { ui.edit = null; ui.form = null; ui.img = undefined; }
    render(); toast(typeof o.ok === 'function' ? o.ok(out.result) : o.ok || 'Gespeichert');
    return true;
  } catch (e) {
    if (e.status === 401) { D = null; render(); return false; }
    if (o.err && $(o.err)) { $(o.err).textContent = e.message; try { take(await api.state()); } catch (x) {} }
    else { try { take(await api.state()); } catch (x) {} render(); toast(e.message); }
    return false;
  }
}

/* ---------- actions ---------- */
const DELETE = {
  booking: id => run('cancel', { id }, { ok: 'Reservation abgesagt' }),
  series: id => run('cancelSeries', { series: id }, { ok: r => r.removed + ' Termine abgesagt' }),
  event: id => run('eventDelete', { id }, { ok: 'Anlass abgesagt, Ort wieder frei' }),
  post: id => run('postDelete', { id }, { ok: 'Mitteilung gelöscht' }),
  res: id => run('resDelete', { id }, { ok: 'Gelöscht' }),
  user: id => run('userDelete', { id }, { ok: 'Konto gelöscht' })
};

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, rt = D ? route() : '';
  const res = (rt === 'reservieren' || rt === 'waschen') ? resOf(ui.res[rt]) : null;
  if (a === 'showpass') { v.split(',').forEach(id => { $(id).type = el.checked ? 'text' : 'password'; }); return; }
  if (a === 'pw-suggest') { const w = ['Garten', 'Balkon', 'Sonne', 'Linde', 'Apfel', 'Wolke', 'Brunnen', 'Wiese']; $('us-pw').value = w[Math.floor(Math.random() * w.length)] + '-' + (1000 + Math.floor(Math.random() * 9000)); return; }
  if (a === 'copymail') {
    const done = () => toast('Adresse kopiert');
    const fallback = () => { const range = document.createRange(); range.selectNodeContents($('mail')); const s = getSelection(); s.removeAllRanges(); s.addRange(range); toast('Adresse ist markiert'); };
    try { navigator.clipboard.writeText(D.settings.email).then(done, fallback); } catch (err) { fallback(); }
    return;
  }
  if (a === 'logout') { try { await api.logout(); } catch (err) {} D = null; ui.form = null; ui.edit = null; location.hash = ''; render(); return; }
  if (a === 'going') { const ev = D.events.find(x => x.id === v); if (ev) await run('going', { event: v, on: !ev.iGo }, { ok: ev.iGo ? 'Abgemeldet' : 'Angemeldet' }); return; }
  if (a === 'del-yes') { const x = v.split(':'); ui.del = null; await DELETE[x[0]](x[1]); return; }
  if (a === 'book' && res && ui.sel) {
    const p = { res: res.id, date: ui.day, from: ui.sel.from, to: ui.sel.to, every: res.repeat ? ui.rep.every : 0, months: ui.rep.months };
    const day = ui.day; ui.sel = null;
    await run('book', p, { ok: r => r.made === 1 && !r.skipped ? 'Reserviert für ' + shortDate(day) : r.made + ' Termine reserviert' + (r.skipped ? ', ' + r.skipped + ' waren schon belegt' : '') });
    ui.rep = { every: 0, months: 4 }; return;
  }
  if (a === 'disp') ui.disp = !ui.disp;
  else if (a === 'size') { P.size = Number(v); saveP(); }
  else if (a === 'theme') { P.theme = v; saveP(); }
  else if (a === 'res') { ui.res[rt] = v; try { localStorage.setItem('oele51-last-' + rt, v); } catch (err) {} ui.sel = null; ui.page = 0; }
  else if (a === 'day') { ui.day = v; ui.sel = null; }
  else if (a === 'page') { ui.page = Math.max(0, ui.page + Number(v)); ui.day = core.addDays(D.today, ui.page * 14); ui.sel = null; }
  else if (a === 'allday' && res) { const full = ui.sel && ui.sel.from === res.open && ui.sel.to === res.close; ui.sel = full ? null : { from: res.open, to: res.close }; }
  else if (a === 'wstep' && ui.sel) { const x = v.split(':'); setWheel(x[0], (x[0] === 'wf' ? ui.sel.from : ui.sel.to) + Number(x[1])); }
  else if (a === 'wpick') { const x = v.split(':'); setWheel(x[0], Number(x[1])); }
  else if (a === 'rep') ui.rep.every = Number(v);
  else if (a === 'repm') ui.rep.months = Number(v);
  else if (a === 'del-ask') ui.del = v;
  else if (a === 'del-no') ui.del = null;
  else if (a === 'form') ui.form = v;
  else if (a === 'form-close') ui.form = null;
  else if (a === 'tab') { ui.tab = v; ui.edit = null; ui.img = undefined; }
  else if (a === 'goto') { ui.tab = v; ui.edit = null; if (rt !== 'verwalten') { location.hash = 'verwalten'; return; } }
  else if (a === 'edit') { const x = v.split(':'); ui.edit = { kind: x[0], id: x[1] }; ui.img = undefined; }
  else if (a === 'edit-close') { ui.edit = null; ui.img = undefined; }
  else if (a === 'img-clear') { ui.img = ''; $('ev-prev').hidden = true; $('ev-img').value = ''; el.hidden = true; return; }
  render();
  if (a === 'form' || a === 'edit') { const f = document.querySelector('#app form'); if (f) { f.scrollIntoView({ block: 'start' }); const i = f.querySelector('input,textarea'); if (i) i.focus(); } }
});

let wheelTimer;
document.addEventListener('scroll', e => {
  const w = e.target; if (!w.classList || !w.classList.contains('wheel')) return;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    const vals = w.dataset.vals.split(',').map(Number);
    if (setWheel(w.id, vals[clamp(Math.round(w.scrollTop / WH), 0, vals.length - 1)])) render();
  }, 150);
}, true);

document.addEventListener('change', e => {
  if (e.target.id !== 'ev-img') return;
  const file = e.target.files[0], prev = $('ev-prev'); if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 900 / im.width), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      ui.img = c.toDataURL('image/jpeg', 0.72); prev.src = ui.img; prev.hidden = false;
    };
    im.onerror = () => { $('ev-err').textContent = 'Dieses Bild lässt sich nicht öffnen. Bitte wähle ein anderes.'; };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const val = id => $(id).value.trim(), num = id => Number($(id).value), on = id => $(id).checked, id = e.target.id;
  const editId = ui.edit && ui.edit.id !== 'new' ? ui.edit.id : undefined;
  if (id === 'login') {
    if (!val('lg-name') || !$('lg-pass').value) { $('lg-err').textContent = 'Bitte gib Benutzername und Passwort ein.'; return; }
    try { await api.login(val('lg-name'), $('lg-pass').value); D = await api.state(); location.hash = ''; render(); scrollTo(0, 0); if (api.wake) api.wake(); }
    catch (err) { $('lg-err').textContent = err.message; }
  }
  else if (id === 'pwform') await run('password', { old: $('pw-old').value, new: $('pw-new').value }, { ok: 'Neues Passwort gespeichert', err: 'pw-err', close: true });
  else if (id === 'resform') await run('resSave', { id: editId, name: val('rs-name'), cat: val('rs-cat'), hint: val('rs-hint'), open: num('rs-open'), close: num('rs-close'), minH: num('rs-min'), maxH: num('rs-max'), dayOnly: on('rs-day'), aheadDays: num('rs-ahead'), repeat: on('rs-rep'), repeatMonths: num('rs-repm'), active: on('rs-active') }, { err: 'rs-err', close: true });
  else if (id === 'evform') await run('eventSave', { id: editId, title: val('ev-title'), date: val('ev-date'), from: num('ev-from'), to: num('ev-to'), all: on('ev-all'), res: val('ev-res'), desc: val('ev-desc'), img: ui.img }, { ok: 'Anlass gespeichert', err: 'ev-err', close: true });
  else if (id === 'postform') await run('postSave', { id: editId, title: val('po-title'), body: val('po-body'), important: on('po-imp') }, { ok: 'Mitteilung gespeichert', err: 'po-err', close: true });
  else if (id === 'userform') await run('userSave', { id: editId, name: val('us-name'), login: val('us-login'), role: val('us-role'), password: val('us-pw') }, { ok: 'Konto gespeichert', err: 'us-err', close: true });
  else if (id === 'ctform') await run('settings', { email: val('ct-email'), whatsapp: val('ct-wa'), sender: val('ct-sender') }, { err: 'ct-err' });
});

document.addEventListener('focusout', () => setTimeout(() => { if (ui.stale && !typing()) render(); }, 50));
addEventListener('hashchange', () => { ui.disp = false; ui.sel = null; ui.form = null; ui.edit = null; ui.del = null; ui.img = undefined; ui.page = 0; ui.day = null; render(); scrollTo(0, 0); });

(async function boot() {
  render();
  try { D = await api.state(); } catch (e) { D = null; }
  booted = true; render();
  api.listen(() => { if (D) refresh(); });
})();
})();
</script>
